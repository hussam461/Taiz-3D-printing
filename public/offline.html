<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>لا يوجد اتصال بالإنترنت | Taiz 3D Printing</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; font-family: system-ui, sans-serif; }
      main { width: min(100%, 440px); padding: 32px 24px; border: 1px solid #e2e8f0; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 16px 40px #0f172a12; }
      .icon { display: grid; width: 56px; height: 56px; margin: 0 auto 20px; place-items: center; border-radius: 18px; background: #ccfbf1; color: #0f766e; font-size: 28px; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 12px 0 24px; color: #64748b; line-height: 1.8; }
      button { min-height: 46px; padding: 0 22px; border: 0; border-radius: 12px; background: #0f988b; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">⌁</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذر فتح هذه الصفحة المحفوظة. اتصل بالإنترنت وحاول مجددًا لتصفح أحدث المنتجات والأسعار.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
